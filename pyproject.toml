[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-pint"
version = "0.1.0"
description = "Pint-compatible unit parsing and dimensional analysis accelerated by Mojo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT"}

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
